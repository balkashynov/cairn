[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cairn-search"
version = "0.1.0"
description = "Quantized exact vector search and recall diagnostics"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
workbench = ["numpy>=1.26", "pyarrow>=15"]
test = ["pytest>=8", "numpy>=1.26", "ruff==0.17.0"]
benchmark = ["numpy>=1.26", "pyarrow>=15", "faiss-cpu>=1.8"]

[project.scripts]
cairn-workbench = "cairn_search.__main__:main"

[tool.setuptools.packages.find]
where = ["python"]

[tool.pytest.ini_options]
pythonpath = ["python"]
testpaths = ["tests"]

[tool.setuptools.package-data]
cairn_search = ["report.html"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM115"]
