[package]
name = "cairn-search"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Quantized exact vector search with auditable pruning and recall diagnostics"
license = "MIT"

[lib]
name = "cairn"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "cairn"
path = "src/main.rs"

[dependencies]
anyhow = "1"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1

